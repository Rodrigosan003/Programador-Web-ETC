<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    /> -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <title>Botões Bootstrap</title>
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <h1 class="text-center mb-5">Painel de Ações</h1>
      <div class="d-flex flex-wrap gap-3 justify-content-center">
        <botton class="btn btn-primary">Primary</botton>
        <botton class="btn btn-secondary">Secondary</botton>
        <botton class="btn btn-success">Success</botton>
        <botton class="btn btn-danger">Danger</botton>
        <botton class="btn btn-warning">Warning</botton>
        <botton class="btn btn-info">Info</botton>
        <botton class="btn btn-light">Light</botton>
        <botton class="btn btn-dark">Dark</botton>
      </div>
      <hr class="my-5">
      <h3 class="text-center mb-4">Botões Outline</h3>
      <div class="d-flex justify-content-center gap-3">
        <button class="btn btn-outline-primary">Outline Primary</button>
        <button class="btn btn-outline-danger">Outline Danger</button>
      </div>
      <hr class="my-5">
      <h3 class="text-center mb-4">Tamanhos</h3>
      <div class="d-flex justify-content-center gap-3">
        <button class="btn btn-success btn-lg">Botão Grande</button>
        <button class="btn btn-danger btn-sm">Botão Pequeno</button>
      </div>
      <hr class="my-5">
      <h3 class="text-center mb-4">Grupo de Botões</h3>
      <div class="d-flex justify-content-center">
        <div class="btn-group">
          <button class="btn btn-success">Salvar</button>
          <button class="btn btn-warning">Editar</button>
          <button class="btn btn-danger">Excluir</button>
        </div>
      </div>
      <hr class="my-5">
      <h3 class="text-center mb-4">Botão Desabilitado</h3>
      <div class="text-center">
        <button class="btn btn-secondary" disabled>Desabilitado</button>
      </div>
    </div>
    <!-- <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

      crossorigin="anonymous"
    ></script> -->
 <script src="js/bootstrap.bundle.min.js"></script>
  </body>
</html>
