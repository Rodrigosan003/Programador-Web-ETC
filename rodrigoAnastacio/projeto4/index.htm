<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links HTML</title>
    <style>
        body {
            background: gray;
        }

        .links {
            width: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .links a {
            text-decoration: none;
            background: blue;
            color: aliceblue;
            padding: 10px;
            border-radius: 10px;
            transition: .5s ease;
        }

        .links a:hover {
            background: rgba(0, 0, 255, 0.418);
        }
    </style>
</head>

<body>
    <h1>Links em HTML</h1>
    <div class="links">
        <a href="https://google.com" target="_blank">Google</a>
        <a href="https://etcdf.com.br/" target="_blank">ETC-DF</a>
        <a href="pagina2.html" target="_blank">Página 2</a>

        <a href="https://rodrigosan003.github.io/portfolio/" target="_blank">Meu Site</a>
    </div>
</body>

</html>
