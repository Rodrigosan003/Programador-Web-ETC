<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Galeria de Tecnologia</title>
  </head>
  <body>
    <header>
      <h1>Galeria de Tecnologia</h1>
      <p>Conheça algumas tecnologias presentes no nosso cotidiano.</p>
    </header>
    <main>
      <h2>Imagens</h2>
      <figure>
        <img src="imagens/tecnologia.jpg" alt="Tecnologia" />
        <figcaption>Tecnologia</figcaption>
      </figure>
      <figure>
        <img src="imagens/computador.jpg" alt="Computador" />
        <figcaption>Computadores</figcaption>
      </figure>
      <figure>
        <img src="imagens/celular.jpg" alt="Celular" />
        <figcaption>Celulares</figcaption>
      </figure>
      <figure>
        <img src="imagens/internet.jpg" alt="Internet" />
        <figcaption>Internet</figcaption>
      </figure>
      <figure>
        <img
          src="imagens/inteligencia-artificial.jpg"
          alt="Inteligência Artificial"
        />
        <figcaption>Inteligência Artificial</figcaption>
      </figure>
      <figure>
        <img src="imagens/programacao.jpg" alt="Programação" />
        <figcaption>Programação</figcaption>
      </figure>
    </main>
    <footer>
      <p>Atividade de CSS Externo</p>
    </footer>
  </body>
</html>
