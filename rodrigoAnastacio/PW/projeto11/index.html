<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        p {
            color: blue;
            background: greenyellow;
            font-size: 20pt;
            font-family: Arial, Helvetica, sans-serif;
            font-style: italic;
            text-decoration: underline;
            font-weight: bold;
            cursor: pointer;
            transition: .5s ease-in-out;
        }

        p:hover {
            background: none;
            color: black;
            text-decoration: none;
            font-style: normal;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
    </style>
</head>
<body>
    <!-- Aqui tem um css inline: -->
     <p style="color: green;">Css inline</p>
     <p>Aqui tem um css interno</p>
     <p>Aqui tem um css interno 1</p>
</body>
</html>
