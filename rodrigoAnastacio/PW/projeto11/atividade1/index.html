<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>

    <style>
        body {
            background: gray;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 40px;
            color: #181818;
        }

        form {
            background: azure;
            padding: 30px;
            border-radius: 20px;
        }

        label {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 15px;
            color: #181818;
        }

        input {
            height: 20px;
            width: 100%;
            border: 1px solid #181818;
            border-radius: 10px;
            padding: 0 5px;
            background: white;
            margin-bottom: 10px;
        }

        select {
            width: 100%;
            border-radius: 10px;
        }

        textarea {
            height: 80px;
            width: 100%;
            border: 1px solid #181818;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        button {
            height: 30px;
            width: 100%;
            border: none;
            border-radius: 10px;
        }

        .enviar {
            background: blue;
            color: aliceblue;
            margin-bottom: 10px;
        }

        .limpar {
            background: gray;
            color: aliceblue;
        }
    </style>
</head>
<body>
    <h1>Formulário</h1>
    <form>
        <label for="nome">Nome:</label><br>
        <input type="text" name="nome" id="nome"><br>

        <label for="email">Email:</label><br>
        <input type="email" name="email" id="email"><br>

        <label for="password">Senha:</label><br>
        <input type="password" name="password" id="password"><br>
        
        <label for="estado">Estado:</label><br>
        <select name="estado" id="estado">
            <option value="DF">DF</option>
            <option value="SP">SP</option>
            <option value="MG">MG</option>
            <option value="RJ">RJ</option>
        </select><br>

        <label for="assunto">Assunto:</label><br>
        <input type="text" name="assunto" id="assunto"><br>

        <label for="msg">Mensagem:</label><br>
        <textarea name="msg" id="msg"></textarea><br>

        <button class="enviar">Enviar</button><br>
        <button class="limpar">Limpar</button>
    </form>
</body>
</html>
