<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body style="background: #c5c5c5; width: 100%; display: flex; align-items: center; flex-direction: column; padding: 30px;">
    <h1 style="text-align: center; font-size: 40px; font-family: Verdana, Geneva, Tahoma, sans-serif;">Cadastro</h1>
    <form style="background: aliceblue; border-radius: 30px; padding: 30px; box-shadow: 3px 3px 3px rgba(0, 0, 0, 0.4);">
        <label for="nome" style="font-family: Verdana, Geneva, Tahoma, sans-serif; font-size: 20px; color: #2b2b2b;">Nome:</label><br>
        <input type="text" name="nome" id="nome" style="width: 100%; height: 25px; border: 1px solid #c5c5c5; border-radius: 10px; margin-bottom: 20px;"><br>

        <label for="email" style="font-family: Verdana, Geneva, Tahoma, sans-serif; font-size: 20px; color: #2b2b2b;">E-mail:</label><br>
        <input type="email" name="email" id="email" style="width: 100%; height: 25px; border: 1px solid #c5c5c5; border-radius: 10px; margin-bottom: 20px;"><br>

        <label for="password" style="font-family: Verdana, Geneva, Tahoma, sans-serif; font-size: 20px; color: #2b2b2b;">Senha:</label><br>
        <input type="password" name="password" id="password" style="width: 100%; height: 25px; border: 1px solid #c5c5c5; border-radius: 10px; margin-bottom: 20px;"><br>

        <label for="date" style="font-family: Verdana, Geneva, Tahoma, sans-serif; font-size: 20px; color: #2b2b2b;">Data de Nascimento:</label><br>
        <input type="date" name="email" id="date"><br>

        <h3 style="font-family: Verdana, Geneva, Tahoma, sans-serif; font-size: 20px; color: #2b2b2b; font-weight: 100;">Gênero</h3>
        <input type="radio" name="masc" id="masc">
        <label for="masc" style="font-family: Verdana, Geneva, Tahoma, sans-serif; font-size: 20px; color: #2b2b2b;">Masculino</label>

        <input type="radio" name="fem" id="fem">
        <label for="fem" style="font-family: Verdana, Geneva, Tahoma, sans-serif; font-size: 20px; color: #2b2b2b;">Feminino</label>

        <input type="radio" name="outro" id="outro">
        <label for="outro" style="font-family: Verdana, Geneva, Tahoma, sans-serif; font-size: 20px; color: #2b2b2b;">Outro</label>

        <h3 style="font-family: Verdana, Geneva, Tahoma, sans-serif; font-size: 20px; color: #2b2b2b; font-weight: 100;">Gênero</h3>
        <input type="checkbox" name="tech" id="tech">
        <label for="tech" style="font-family: Verdana, Geneva, Tahoma, sans-serif; font-size: 20px; color: #2b2b2b;">Tecnologia</label>

        <input type="checkbox" name="sport" id="sport">
        <label for="sport" style="font-family: Verdana, Geneva, Tahoma, sans-serif; font-size: 20px; color: #2b2b2b;">Esportes</label>

        <input type="checkbox" name="music" id="music">
        <label for="music" style="font-family: Verdana, Geneva, Tahoma, sans-serif; font-size: 20px; color: #2b2b2b;">Música</label><br><br>

        <label for="estado" style="font-family: Verdana, Geneva, Tahoma, sans-serif; font-size: 20px; color: #2b2b2b;">Estado:</label><br>
        <select name="estado" id="estado" style="width: 100%; margin-bottom: 20px;">
            <option value="DF">DF</option>
            <option value="SP">SP</option>
            <option value="RJ">RJ</option>
        </select><br>

        <label for="coment" style="font-family: Verdana, Geneva, Tahoma, sans-serif; font-size: 20px; color: #2b2b2b;">Comentários:</label><br>
        <textarea name="coment" id="coment" style="width: 100%; height: 100px; border: 1px solid #c5c5c5; border-radius: 10px; margin-bottom: 20px;"></textarea><br>

        <button style="width: 100%; height: 40px; color: white; background: green; border: none; border-radius: 10px; font-family: Verdana, Geneva, Tahoma, sans-serif; font-weight: bold; font-size: 20px;">Enviar</button>
    </form>
</body>
</html>
