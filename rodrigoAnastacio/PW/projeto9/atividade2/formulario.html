<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Cadastro</h1>
    <form>
        <label for="nome">Nome:</label><br>
        <input type="text" name="nome" id="nome"><br>

        <label for="email">E-mail:</label><br>
        <input type="email" name="email" id="email"><br>

        <label for="password">Senha:</label><br>
        <input type="password" name="password" id="password"><br>

        <label for="date">Data de Nascimento:</label><br>
        <input type="date" name="email" id="date"><br>

        <h3>Gênero</h3>
        <input type="radio" name="masc" id="masc">
        <label for="masc">Masculino</label>

        <input type="radio" name="fem" id="fem">
        <label for="fem">Feminino</label>

        <input type="radio" name="outro" id="outro">
        <label for="outro">Outro</label>

        <h3>Gênero</h3>
        <input type="checkbox" name="masc" id="masc">
        <label for="masc">Masculino</label>

        <input type="checkbox" name="fem" id="fem">
        <label for="fem">Feminino</label>

        <input type="checkbox" name="outro" id="outro">
        <label for="outro">Outro</label>
    </form>
</body>
</html>
