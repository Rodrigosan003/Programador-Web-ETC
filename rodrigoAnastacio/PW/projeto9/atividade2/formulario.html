<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body style="background: #c5c5c5; width: 100%; height: 100vh; display: flex; align-items: center; flex-direction: column;">
    <h1 style="text-align: center; font-size: 40px; font-family: Verdana, Geneva, Tahoma, sans-serif;">Cadastro</h1>
    <form style="border: 2px solid black; border-radius: 30px; padding: 30px;">
        <label for="nome">Nome:</label><br>
        <input type="text" name="nome" id="nome"><br>

        <label for="email">E-mail:</label><br>
        <input type="email" name="email" id="email"><br>

        <label for="password">Senha:</label><br>
        <input type="password" name="password" id="password"><br>

        <label for="date">Data de Nascimento:</label><br>
        <input type="date" name="email" id="date"><br>

        <h3>Gênero</h3>
        <input type="radio" name="masc" id="masc">
        <label for="masc">Masculino</label>

        <input type="radio" name="fem" id="fem">
        <label for="fem">Feminino</label>

        <input type="radio" name="outro" id="outro">
        <label for="outro">Outro</label>

        <h3>Gênero</h3>
        <input type="checkbox" name="tech" id="tech">
        <label for="tech">Tecnologia</label>

        <input type="checkbox" name="sport" id="sport">
        <label for="sport">Esportes</label>

        <input type="checkbox" name="music" id="music">
        <label for="music">Música</label><br>

        <label for="estado">Estado:</label><br>
        <select name="estado" id="estado">
            <option value="DF">DF</option>
            <option value="SP">SP</option>
            <option value="RJ">RJ</option>
        </select>

        <label for="coment">Comentários:</label><br>
        <textarea name="coment" id="coment" cols="30" rows="10"></textarea><br>

        <button>Enviar</button>
    </form>
</body>
</html>
