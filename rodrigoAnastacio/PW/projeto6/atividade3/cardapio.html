<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cardápio</title>
  </head>
  <body>
    <h1>Cardápio de Lanchonete</h1>
    <table border="1" align="center">
      <tr>
        <th colspan="4">CARDÁPIO</th>
      </tr>
      <tr>
        <td><strong>Categoria</strong></td>
        <td><strong>Item</strong></td>
        <td><strong>Preço</strong></td>
        <td><strong>Promoção</strong></td>
      </tr>
      <tr>
        <td rowspan="2">Lanches</td>
        <td>X-Burger</td>
        <td>R$ 18,00</td>
        <td rowspan="2">10%</td>
      </tr>
      <tr>
        <td>X-Salada</td>
        <td>R$ 20,00</td>
      </tr>
      <tr>
        <td rowspan="2">Bebidas</td>
        <td>Refrigerante</td>
        <td>R$ 6,00</td>
        <td rowspan="3">Sem Promoção</td>
      </tr>
      <tr>
        <td>Suco</td>
        <td>R$ 8,00</td>
      </tr>
      <tr>
        <td>Sobremesa</td>
        <td>Pudim</td>
        <td>R$ 10,00</td>
      </tr>
    </table>
  </body>
</html>
