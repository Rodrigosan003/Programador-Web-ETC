<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>

<body>
    <table border="1" align="center">
        <tr>
            <th colspan="3">Horário</th>
        </tr>
        <tr>
            <td><strong>Horário</strong></td>
            <td colspan="2"><strong>Disciplina</strong></td>
        </tr>
        <tr>
            <td>08:00</td>
            <td colspan="2">HTML</td>
        </tr>
        <tr>
            <td>09:00</td>
            <td colspan="2">CSS</td>
        </tr>
        <tr>
            <td rowspan="2">Intervalo</td>
            <td>10:00</td>
            <td>Café</td>
        </tr>
        <tr>
            <td>10:30</td>
            <td>Retorno</td>
        </tr>
    </table>
</body>

</html>
