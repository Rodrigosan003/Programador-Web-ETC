<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h3>Formulário</h3>
    <form>
        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nome"><br>

        <label for="password">Senha:</label>
        <input type="password" name="password" id="password"><br>

        <label>Sexo:</label>
        <label for="m">Masc</label>
        <input type="radio" name="sex" id="m" value="masc" checked>
        <label for="f">Fem</label>
        <input type="radio" name="sex" id="f" value="fem">

        <h3>Hobbys</h3>
        <label for="ler">Ler:</label>
        <input type="checkbox" name="ler" id="ler">
        <label for="ler">Correr:</label>
        <input type="checkbox" name="correr" id="correr">
        <label for="ler">Jogar:</label>
        <input type="checkbox" name="jogar" id="jogar" checked>
        <label for="ler">Assistir:</label>
        <input type="checkbox" name="assistir" id="assistir"><br><br>

        <label for="estado">Estado:</label>
        <select name="estado" id="estado">
            <option value="Selecione" selected>Selecione</option>
            <option value="DF">DF</option>
            <option value="SP">SP</option>
            <option value="RJ">RJ</option>
        </select>
        <br><br>
        <label for="coment">Comentários:</label><br>
        <textarea name="coment" id="coment" cols="40" rows="5" placeholder="Escreva seu comentário..."></textarea><br><br>


        <input type="submit" name="enviar" value="Enviar">
        <input type="reset" name="apagar" value="Apagar">
        <button>Botão</button>
    </form>
</body>
</html>
