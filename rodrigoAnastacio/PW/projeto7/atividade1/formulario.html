<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Cadastro</h1>
    <fieldset>
        <legend>Cadastro</legend>
        <form>
            <label for="nome">Nome:</label><br>
            <input type="text" name="nome" id="nome"><br><br>

            <label for="email">E-mail:</label><br>
            <input type="email" name="email" id="email"><br><br>

            <label for="password">Senha:</label><br>
            <input type="password" name="password" id="password"><br><br>

            <label for="date">Data de Nascimento:</label><br>
            <input type="date" name="date" id="date"><br><br>

            <p>Gênero:</p>
            <input type="radio" name="masc" id="masc">
            <label for="masc">Masculino</label>

            <input type="radio" name="fem" id="fem">
            <label for="fem">Feminino</label>

            <input type="radio" name="outro" id="outro">
            <label for="outro">Outro</label>

            <p>Interesses:</p>
            <input type="checkbox" name="tec" id="tec">
            <label for="tec">Tecnologia</label>

            <input type="checkbox" name="esp" id="esp">
            <label for="esp">Esportes</label>

            <input type="checkbox" name="music" id="music">
            <label for="music">Música</label><br><br>

            <label for="estados">Estados:</label><br>
            <select name="estados" id="estados">
                <option value="DF">DF</option>
                <option value="SP">SP</option>
                <option value="RJ">RJ</option>
            </select><br><br>

            <label for="com">Comentários:</label><br>
            <textarea name="com" id="com" cols="40" rows="5" placeholder="Seus comentários aqui..."></textarea><br><br>
            <input type="submit" value="Enviar">
        </form>
    </fieldset>
</body>
</html>
